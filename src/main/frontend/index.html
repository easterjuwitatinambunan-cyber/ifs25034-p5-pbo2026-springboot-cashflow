<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    html, body, #outlet {
      height: 100%;
      width: 100%;
      margin: 0;
    }

    /*
    Fix app height for iOS home screen apps (sama seperti template bawaan Vaadin).
    */
    @supports (-webkit-touch-callout: none) {
      @media (display-mode: standalone) {
        html {
          height: 100lvh;
        }
      }
    }

    /*
    Layar pembuka statis (landmark main + heading h1 sehingga tetap aksesibel bila ada audit
    yang berjalan sebelum aplikasi selesai dimuat): tampil segera dari HTML awal, sebelum bundle JavaScript Vaadin siap,
    sehingga First Contentful Paint dan Largest Contentful Paint tidak menunggu proses boot aplikasi.
    Otomatis tersembunyi begitu konten aplikasi (main / app layout) muncul; animasi cadangan
    menyembunyikannya setelah 12 detik agar tidak pernah menutupi aplikasi.
    */
    #cf-splash {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      box-sizing: border-box;
      text-align: center;
      background: linear-gradient(135deg, #DBEAFE 0%, #F9FAFB 60%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      pointer-events: none;
      animation: cf-splash-fallback 0s linear 12s forwards;
    }

    #cf-splash .cf-splash-brand {
      margin: 0;
      font-size: 3rem;
      font-weight: 700;
      color: #1D4ED8;
    }

    #cf-splash .cf-splash-text {
      margin: 0;
      max-width: 34rem;
      font-size: 1.5rem;
      line-height: 1.4;
      color: #374151;
    }

    #outlet:has(main, vaadin-app-layout) ~ #cf-splash {
      display: none;
    }

    @keyframes cf-splash-fallback {
      to {
        visibility: hidden;
      }
    }
  </style>
  <!-- index.ts is included here automatically (either by the dev server or during the build) -->
</head>
<body>
  <!-- This outlet div is where the views are rendered -->
  <div id="outlet"></div>
  <main id="cf-splash">
    <h1 class="cf-splash-brand">Cashflow</h1>
    <p class="cf-splash-text">Catat pemasukan dan pengeluaran, pantau saldo Anda, dan simpan bukti transaksi dengan mudah.</p>
  </main>
</body>
</html>
